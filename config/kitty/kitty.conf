#: vim:fileencoding=utf-8:foldmethod=marker
#: Original kitty-generated default template backed up at kitty.conf.default.bak

#: Fonts {{{
font_family      Comic Mono
bold_font        auto
font_size        15.0
#: }}}

#: Shell {{{
shell /opt/homebrew/bin/fish
shell_integration enabled
#: }}}

#: Scrollback {{{
scrollback_lines 10000
wheel_scroll_min_lines 1
#: }}}

#: Mouse / selection {{{
copy_on_select   yes
mouse_map ctrl+left click ungrabbed mouse_click_url
#: }}}

#: Bell {{{
enable_audio_bell no
#: }}}

#: Window layout {{{
enabled_layouts tall,fat,grid,stack,splits
map ctrl+shift+enter launch --location=hsplit --cwd=current
map ctrl+shift+minus  launch --location=vsplit --cwd=current
map ctrl+shift+l      next_layout
#: }}}

#: Tabs {{{
map ctrl+shift+t new_tab_with_cwd
tab_bar_style    custom
tab_bar_min_tabs 1

#: Rename current tab (~ tmux "rename-window") - matches alacritty.toml's
#: Cmd+, -> Ctrl-b , exactly. Overrides kitty's stock cmd+, (edit_config_file);
#: use ctrl+shift+f5 to reload config, or open kitty.conf directly to edit it.
map cmd+,              set_tab_title
#: Rename current split/pane (~ kitty's own "window" - no direct tmux equivalent)
map ctrl+shift+alt+,   set_window_title
#: }}}

#: Window / OS behavior {{{
confirm_os_window_close 0
#: }}}

#: Hints kitten - pull IPs, hashes, paths, urls out of output {{{
map ctrl+shift+p>i kitten hints --type ip
map ctrl+shift+p>h kitten hints --type hash
map ctrl+shift+p>f kitten hints --type path
map ctrl+shift+p>u kitten hints --type url
#: }}}

#: Broadcast kitten - type once, send to all panes in the tab {{{
map ctrl+shift+z kitten broadcast
#: }}}

#: Remote control - lets you script kitty from the outside (kitty @ ...) {{{
allow_remote_control yes
listen_on unix:/tmp/kitty
#: }}}

#: SSH kitten - fixes remote TERM/terminfo issues automatically {{{
map ctrl+shift+s launch --type=tab kitten ssh
#: }}}

#: Muscle memory carried over from alacritty.toml + .tmux.conf {{{

#: Alt+F / Alt+B -> ESC f / ESC b (readline/fish forward-word, backward-word).
#: Reproduces exactly the two custom bindings from alacritty.toml, rather than
#: flipping the global macos_option_as_alt switch, which would also disable
#: Option-key accented-character input everywhere else.
map alt+f send_text all \ef
map alt+b send_text all \eb

#: Direct (no-prefix) pane switching, mirrors `.tmux.conf`'s
#: `bind -n M-Left/Right/Up/Down select-pane ...`
map alt+left  neighboring_window left
map alt+right neighboring_window right
map alt+up    neighboring_window top
map alt+down  neighboring_window bottom

#: Cmd+D -> tmux `%` (split side-by-side, cwd preserved). Cmd+Shift+D is left
#: as kitty's own default (close_window) since that's a standard macOS
#: convention worth keeping; the stacked/top-bottom split from tmux's `"` is
#: already available via ctrl+shift+enter above.
map cmd+d launch --location=vsplit --cwd=current

#: Cmd+W -> tmux `&` (kill-pane: close just the focused split, not the whole
#: tab). This overrides kitty's stock cmd+w (close_tab) - that action moves
#: to ctrl+shift+w so it's still reachable.
map cmd+w         close_window
map ctrl+shift+w  close_tab

#: Cmd+Return -> tmux `z` (zoom/maximize the current pane). Overrides kitty's
#: stock cmd+enter (new_window) - still available via ctrl+shift+enter/cmd+d.
map cmd+enter toggle_layout stack

#: Cmd+1..9 -> tmux `select-window N`. Since kitty tabs are tmux's
#: "windows", this overrides kitty's stock cmd+1..9 (select pane N by
#: position) in favor of switching tabs by number.
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9

#: Cmd+S -> tmux `s` (choose-tree: interactive session/window picker).
#: Closest kitty equivalent is an interactive tab picker.
map cmd+s select_tab

#: Cmd+] / Ctrl+Cmd+] -> tmux `o` / `}` (next pane / swap pane down)
#: Ctrl+Cmd+[ -> tmux `{` (swap pane up). kitty already has default
#: shortcuts for the swap actions (ctrl+shift+f / ctrl+shift+b); these are
#: added as aliases, not replacements.
map cmd+]       next_window
map ctrl+cmd+]  move_window_forward
map ctrl+cmd+[  move_window_backward

#: Cmd+K -> tmux `k` (clear screen + scrollback). Deliberately NOT bound on
#: bare ctrl+k like tmux's `bind -n C-k` - that would break fish/readline's
#: own Ctrl+K (kill-to-end-of-line) since there's no tmux layer to intercept
#: it first anymore.
map cmd+k clear_terminal reset active

#: Not portable from tmux - no kitty equivalent exists:
#:  - Ctrl+Cmd+, (rename-session) / Cmd+Escape (switch-client -p): kitty has
#:    no renameable "session" concept and no multi-session switcher (see
#:    earlier discussion - the closest thing is a named --session file).
#:  - Cmd+[ (tmux `;`, toggle last-active-pane): kitty has no MRU-based
#:    "jump to last focused window" action.
#: }}}

#: Theme - Ayu Dark, matching the palette already in fish_frozen_theme.fish {{{
background            #0A0E14
foreground            #B3B1AD
cursor                 #E6B450
cursor_text_color      #0A0E14
selection_background   #273747
selection_foreground   #B3B1AD

url_color              #59C2FF

#: Solid blue bar, matching tmux's `status-bg blue` - which itself renders
#: using this terminal's ANSI color4 (see color4 below), so this must match.
tab_bar_background      #53BDFA
active_tab_background    #FFFFFF
active_tab_foreground   #0A0E14
inactive_tab_background  #53BDFA
inactive_tab_foreground #FFFFFF

#: black
color0  #01060E
color8  #686868
#: red
color1  #EA6C73
color9  #FF3333
#: green
color2  #91B362
color10 #C2D94C
#: yellow
color3  #F9AF4F
color11 #E6B450
#: blue
color4  #53BDFA
color12 #59C2FF
#: magenta
color5  #FAE994
color13 #FFEE99
#: cyan
color6  #90E1C6
color14 #95E6CB
#: white
color7  #C7C7C7
color15 #FFFFFF
#: }}}
